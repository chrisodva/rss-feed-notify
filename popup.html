<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>RSS Bookmark Checker</title>
    <style>
      body {
        font: 13px sans-serif;
        min-width: 360px;
        max-width: 360px;
        padding: 12px;
      }

      h1 {
        font-size: 16px;
        margin: 0 0 10px;
      }

      h2 {
        font-size: 13px;
        margin: 16px 0 6px;
      }

      button {
        margin: 4px 4px 4px 0;
      }

      input, select {
        width: 100%;
        box-sizing: border-box;
        margin: 4px 0 8px;
      }

      .status {
        margin-top: 8px;
        white-space: pre-wrap;
      }

      .bookmark-list {
        max-height: 180px;
        overflow: auto;
        border: 1px solid #ccc;
        padding: 6px;
      }

      .bookmark-item {
        margin-bottom: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid #eee;
      }

      .bookmark-item:last-child {
        border-bottom: none;
      }

      .small {
        color: #555;
        font-size: 12px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>RSS Bookmark Checker</h1>

    <button id="checkFeeds">Check feeds</button>
    <button id="clearMarkers">Clear all markers</button>

    <div class="status" id="status"></div>

    <h2>Add current site</h2>
    <input id="newFeedUrl" type="text" placeholder="Feed URL for current tab">
    <button id="addCurrentSite">Add current site</button>

    <h2>Edit existing bookmark</h2>
    <select id="bookmarkSelect"></select>
    <input id="editFeedUrl" type="text" placeholder="Feed URL for selected bookmark">
    <button id="saveFeedUrl">Save feed URL</button>

    <h2>Bookmarks in RSS Feeds</h2>
    <div id="bookmarkList" class="bookmark-list"></div>

    <script src="popup.js"></script>
  </body>
</html>
